services:
  scheduler:
    build: .
    command: taskrunner scheduler
    environment:
      TASKRUNNER_API_HOST: 0.0.0.0
      TASKRUNNER_SCHEDULER_HOST: 0.0.0.0
      TASKRUNNER_SQLITE_PATH: /var/lib/taskrunner/taskrunner.db
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - taskrunner-data:/var/lib/taskrunner
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: taskrunner worker --queues default,cpu,io --labels cpu,gpu
    environment:
      TASKRUNNER_SCHEDULER_HOST: scheduler
      TASKRUNNER_API_HOST: scheduler
      TASKRUNNER_WORKER_CAPACITY: 2
    depends_on:
      scheduler:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  taskrunner-data:
